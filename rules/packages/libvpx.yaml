# libvpx — VP8/VP9 codec. Built for IRIX 6.5 n32 as VP8-encoder-only.
#
# Verified on IRIX 6.5.22m / R5000 with a full encode -> decode round trip at
# 1280x1024, 640x512 and 320x256: every frame decodes, geometry is right, and Y
# mean absolute error is 0.4-2.0 against the source. That matters more than it
# sounds -- libvpx here is the portable C build on a 32-bit BIG-ENDIAN target,
# which is the configuration least exercised upstream, and a byte-order fault
# would not have failed the build, only the picture.
#
# ONE SOURCE PATCH IS NEEDED, and it is a genuine IRIX collision:
#
#   vpx_util/vpx_thread.c declares `static int sync(VPxWorker *const)`, and
#   IRIX's <unistd.h> declares `extern void sync(void)` at line 446. clang
#   rejects the static as conflicting with the non-static declaration already
#   in scope. Renamed to sync_worker(). Note the struct member `winterface->sync`
#   is a DIFFERENT thing and must not be renamed with it -- see the patch.
#
# BUILD THE LIBRARY TARGET, NOT `all`. `make` alone also builds libvpxrc.a,
# the C++ rate-control-RTC interface, from vp8_ratectrl_rtc.cc. That needs a
# C++ standard library the cross toolchain has no headers for, so it dies on
# `'new' file not found` -- for a library nothing here links. `make libvpx.a`
# skips it entirely and needs no patch to libs.mk.
#
# --disable-webm-io --disable-libyuv are NOT optional. Both are C++, and
# leaving them on makes configure pick the HOST g++ as the linker, which then
# fails with "relocations in generic ELF (EM: 8)" -- i.e. it is feeding MIPS
# objects to an x86 linker. The error names the wrong culprit, so it is worth
# knowing the cause is these two flags.
#
# CONSUMERS MUST LINK -lpthread. Same trap as libsodium: libvpx's threading is
# pthreads, the symbols resolve at link time on IRIX without -lpthread, and the
# failure only shows at run time.
#
# No %zu anywhere in the encoder path, checked -- unusually clean for a modern
# C package. See rules/methods/irix-quirks.md for why that is worth checking.

package: libvpx

rules:

  patches:
    - libvpx-irix-sync-name-collision.patch

  # Fedora's spec calls `./configure` directly rather than %configure, and its
  # arch ladder has no MIPS branch -- MIPS falls through to generic-gnu, which
  # is the target we want, but every other flag on that line is wrong for us.
  # configure_flags cannot help here because there is no %configure to hook, so
  # the invocation is rewritten instead. Verified against the f40 spec.
  spec_replacements:
    # VP8 only, no C++, static. See the notes above for why webm-io and libyuv
    # are not optional and why --enable-shared has to go.
    - pattern: |
        ./configure --target=%{vpxtarget} \
        --enable-pic --disable-install-srcs \
        --enable-vp9-decoder --enable-vp9-encoder \
        --enable-experimental \
        --enable-vp9-highbitdepth \
        --enable-debug \
      replacement: |
        ./configure --target=%{vpxtarget} \
        --disable-shared --enable-static \
        --enable-vp8-encoder --enable-vp8-decoder \
        --disable-vp9-encoder --disable-vp9-decoder \
        --disable-examples --disable-tools --disable-docs --disable-unit-tests \
        --disable-runtime-cpu-detect --disable-webm-io --disable-libyuv \
        --disable-install-srcs \
    # generic_target is 0 in both arms of the spec's own %if, so this would
    # otherwise pass --enable-shared regardless. Static only on IRIX: a .so
    # costs rld GOT entries for something nothing here links.
    #
    # The replacement is EMPTY on purpose. These lines sit inside a backslash
    # continuation, so a comment here would swallow the rest of the invocation:
    # the shell ignores everything after `#`, --prefix and --libdir would be
    # dropped, and then run as a command of their own on the next line.
    - pattern: |
        %if ! %{generic_target}
        --enable-shared \
        %endif
      replacement: ""
    - pattern: "--enable-install-srcs \\\n"
      replacement: ""
    # Build the library only. `make` alone also builds libvpxrc.a from
    # vp8_ratectrl_rtc.cc, which needs a C++ standard library the cross
    # toolchain has no headers for and dies on `'new' file not found`.
    - pattern: "%make_build verbose=true"
      replacement: "%make_build verbose=true libvpx.a"

  configure_flags:
    add:
      - --target=generic-gnu        # no MIPS asm: the MSA/mmi paths upstream
                                    # has are for Loongson/MSA parts, and no
                                    # CPU that runs IRIX has either.
      - --disable-shared
      - --enable-static
      - --enable-vp8-encoder
      - --enable-vp8-decoder        # small, and it lets a target-side test
                                    # round-trip its own output
      - --disable-vp9-encoder
      - --disable-vp9-decoder
      - --disable-examples
      - --disable-tools
      - --disable-docs
      - --disable-unit-tests
      - --disable-runtime-cpu-detect
      - --disable-webm-io           # C++; see above
      - --disable-libyuv            # C++; see above

  # `make_target` was used here and is NOT a key the engine implements -- it
  # appears in no Python file, so it was silently ignored and the spec built
  # `all`, which is exactly what the note above says must not happen. Expressed
  # as a spec_replacement, which the engine does implement.
